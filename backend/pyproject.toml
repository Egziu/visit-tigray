[project]
name = "visit-tigray-api"
version = "2.0.0.dev0"
requires-python = ">=3.12"
description = "Visit Tigray API — modular monolith (FastAPI, PostgreSQL/PostGIS/pgvector)"

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008", "S311", "UP040", "B904", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE", "E501"]
"app/seed.py" = ["T201"]
"app/modules/identity/permissions.py" = ["E501"]
"app/modules/tie/policy.py" = ["E501"]
"app/modules/platform/service.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
plugins = []
exclude = ["migrations/", "tests/"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101"]
